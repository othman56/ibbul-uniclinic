<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Staff Account | UniClinic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@700&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #006B4E; }
    body { background: linear-gradient(135deg,#0f1e17,#1a3828); min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:'DM Sans',sans-serif; }
    .card { border-radius:20px; max-width:420px; width:100%; border:none; box-shadow:0 24px 64px rgba(0,0,0,.35); padding:2.5rem 2rem; }
    .form-control:focus { border-color:var(--primary); box-shadow:0 0 0 .2rem rgba(0,107,78,.15); }
    .btn-primary { background:var(--primary); border:none; font-weight:600; border-radius:10px; padding:.75rem; }
    .btn-primary:hover { background:#005a40; }
  </style>
</head>
<body>
<div class="card bg-white">
  <div class="text-center mb-4">
    <div style="width:56px;height:56px;background:var(--primary);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto .75rem;">
      <i class="bi bi-person-badge-fill text-white fs-4"></i>
    </div>
    <h5 class="fw-bold mb-0" style="font-family:'Fraunces',serif;">Create Staff Account</h5>
    <small class="text-muted">IBBU UniClinic — Clinic Staff</small>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, msg in messages %}
    <div class="alert alert-{{ 'success' if cat=='success' else 'danger' }} py-2 mb-3" style="border-radius:10px;border:none;font-size:.875rem;">{{ msg }}</div>
    {% endfor %}{% endif %}
  {% endwith %}

  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold" style="font-size:.875rem;">Username</label>
      <input type="text" name="username" class="form-control" placeholder="e.g. clinic_admin" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold" style="font-size:.875rem;">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Choose a strong password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100 mb-3">
      <i class="bi bi-check-lg me-2"></i>Create Account
    </button>
    <div class="text-center">
      <a href="{{ url_for('auth.login') }}" style="font-size:.85rem;color:var(--primary);">← Back to Login</a>
    </div>
  </form>
</div>
</body>
</html>
