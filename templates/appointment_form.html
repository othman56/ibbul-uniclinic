{% extends 'staff_base.html' %}
{% block title %}Book Appointment{% endblock %}{% block page_title %}Book Appointment{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card">
<div class="card-header py-3 px-4"><i class="bi bi-calendar-plus me-2 text-success"></i>New Appointment</div>
<div class="card-body p-4"><form method="POST">
  <div class="mb-3"><label class="form-label">Patient *</label><select name="patient_id" class="form-select" required><option value="">— Select Patient —</option>{% for p in patients %}<option value="{{ p.id }}">{{ p.name }} ({{ p.matric_no }})</option>{% endfor %}</select></div>
  <div class="row g-3 mb-3"><div class="col-6"><label class="form-label">Date *</label><input type="date" name="date" class="form-control" required></div><div class="col-6"><label class="form-label">Time *</label><input type="time" name="time" class="form-control" required></div></div>
  <div class="mb-3"><label class="form-label">Reason for Visit</label><textarea name="reason" class="form-control" rows="3" placeholder="Describe the complaint…"></textarea></div>
  <div class="d-flex gap-2"><button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Book Appointment</button><a href="{{ url_for('appointments') }}" class="btn btn-outline-secondary">Cancel</a></div>
</form></div>
</div></div></div>{% endblock %}
