<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | IBBU UniClinic</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #006B4E; --accent: #F4A520; }
    body {
      background: linear-gradient(135deg, #0f1e17 0%, #1a3828 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }
    .login-card {
      background: #fff; border-radius: 20px; padding: 2.5rem 2rem;
      width: 100%; max-width: 420px;
      box-shadow: 0 24px 64px rgba(0,0,0,.35);
    }
    .logo-circle {
      width: 60px; height: 60px; background: var(--primary); border-radius: 16px;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;
    }
    .brand { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 700; color: #0f1e17; }
    .subtitle { color: #6b8c7e; font-size: .85rem; }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 .2rem rgba(0,107,78,.15); }
    .btn-login { background: var(--primary); border: none; color: #fff; font-weight: 600; padding: .75rem; border-radius: 10px; }
    .btn-login:hover { background: #005a40; color: #fff; }
    .role-badge {
      display: inline-flex; align-items: center; gap: .4rem;
      background: #f0faf5; border: 1px solid #c3e6d8; color: var(--primary);
      border-radius: 20px; padding: .25rem .75rem; font-size: .78rem; font-weight: 600;
    }
    .alert { border-radius: 10px; border: none; font-size: .875rem; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="text-center mb-4">
    <div class="logo-circle">
      <i class="bi bi-heart-pulse-fill text-white fs-4"></i>
    </div>
    <div class="brand">UniClinic</div>
    <div class="subtitle">IBBU, Lapai — Medical Management System</div>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
      <div class="alert alert-{{ 'success' if category == 'success' else 'warning' if category == 'warning' else 'info' if category == 'info' else 'danger' }} mb-3">
        {{ message }}
      </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST">
    <div class="mb-3">
      <label class="form-label fw-semibold" style="font-size:.875rem;">Username</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
        <input type="text" name="username" class="form-control border-start-0" placeholder="Enter your username" required autofocus>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold" style="font-size:.875rem;">Password</label>
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
        <input type="password" name="password" id="pwd" class="form-control border-start-0" placeholder="Enter your password" required>
        <button type="button" class="input-group-text bg-light" onclick="togglePwd()">
          <i class="bi bi-eye" id="pwd-eye"></i>
        </button>
      </div>
    </div>
    <button type="submit" class="btn btn-login w-100 mb-3">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </button>
  </form>

  <div class="text-center">
    <div class="d-flex justify-content-center gap-2 flex-wrap">
      <span class="role-badge"><i class="bi bi-person-badge"></i> Staff login</span>
      <span class="role-badge"><i class="bi bi-mortarboard"></i> Student login</span>
    </div>
    <div class="mt-3" style="font-size:.78rem; color:#9db8ac;">
      First time? <a href="{{ url_for('auth.create_staff') }}" style="color:var(--primary);">Create staff account</a>
    </div>
  </div>
</div>
<script>
  function togglePwd() {
    const p = document.getElementById('pwd');
    const e = document.getElementById('pwd-eye');
    p.type = p.type === 'password' ? 'text' : 'password';
    e.className = p.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
  }
</script>
</body>
</html>
